events {}

http {
    # Docker's embedded DNS (127.0.0.11) round-robins across all replicas of the
    # "api" service when you run `docker compose up --scale api=N`. Using a variable
    # in proxy_pass (instead of a static upstream block) forces Nginx to re-resolve
    # on every request, so newly scaled containers are picked up automatically.
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 200M;

    server {
        listen 80;

        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
